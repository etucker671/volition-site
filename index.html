<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volition Dynamics</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
        /* This sets up your vector gradient background */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            /* Adjust colors here: 'to bottom' means top-to-bottom gradient */
            background: linear-gradient(to bottom, #c76b28, #0d2a42); 
            font-family: Arial, sans-serif;
            box-sizing: border-box;
        }

        /* Container for the logo - perfectly centered */
        .logo-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Your White SVG Logo sizing */
        .logo-container svg {
            width: 229px; /* Adjust size of your logo here (viewBox is wider than the art, see note on svg) */
            height: auto;
            fill: #ffffff; /* Forces the SVG paths to be white */
        }

        /* Container pushed down to exactly 75% (3/4) of the page height */
        .email-container {
            height: 25vh; /* Takes up the bottom 25% of the screen */
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Aligns email to the top of this bottom section */
        }

        /* Styling your email link */
        .email-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1rem;
            letter-spacing: 1px;
            opacity: 0.8;
            transition: opacity 0.2s ease;
        }

        .email-link:hover {
            opacity: 1;
            text-decoration: underline;
        }
    </style>
</head>
